---
# yaml-language-server: $schema=https://www.schemastore.org/helmfile
templates:
  default:
    chart: '{{ (fromYaml (tpl (readFile "./templates/release.yaml.gotmpl") .)).chart }}'
    version: '{{ (fromYaml (tpl (readFile "./templates/release.yaml.gotmpl") .)).version }}'
    values:
      - ./templates/values.yaml.gotmpl
    postRenderer: kustomize-postrender
    postRendererArgs:
      - '{{ tpl (readFile "./templates/patches.yaml.gotmpl") . }}'
