---
# yaml-language-server: $schema=https://www.schemastore.org/helmfile
helmDefaults:
  cleanupOnFail: true
  forceConflicts: true
  wait: true
  waitForJobs: true

bases:
  - default.yaml

defaultInherit: default

releases:
  - name: cilium
    namespace: kube-system
    hooks:
      - command: kubectl
        args:
          - apply
          - --namespace={{ .Release.Namespace }}
          - --server-side
          - --force-conflicts
          - --kustomize=../../kubernetes/apps/_global/priorityclasses
        events:
          - presync
      # Wait for CRDs to be available
      - command: kubectl
        args:
          - wait
          - --for=create
          - crd/ciliumbgpadvertisements.cilium.io
          - crd/ciliumbgpclusterconfigs.cilium.io
          - crd/ciliumbgppeerconfigs.cilium.io
          - crd/ciliumloadbalancerippools.cilium.io
          - --timeout=2m
        events:
          - postsync
        showlogs: true
      # Apply Resources
      - command: kubectl
        args:
          - apply
          - --namespace={{ .Release.Namespace }}
          - --server-side
          - --force-conflicts
          - --filename=../../kubernetes/apps/{{ .Release.Namespace }}/{{ .Release.Name }}/app/bgpconfig.yaml
        events:
          - postsync
        showlogs: true

  - name: coredns
    namespace: kube-system

  - name: spegel
    namespace: spegel-system
    needs:
      - kube-system/coredns

  - name: flux-operator
    namespace: flux-system
    needs:
      - spegel-system/spegel
    hooks:
      - command: sh
        args:
          - -c
          - |
            set -eu
            for f in ../../kubernetes/apps/{{ .Release.Namespace }}/{{ .Release.Name | replace "-" "/" }}/secret-*.sops.yaml; do
              sops --decrypt "$f" | kubectl apply --namespace={{ .Release.Namespace }} --server-side --force-conflicts --filename -
            done
        events:
          - presync

  - name: flux-instance
    namespace: flux-system
    needs:
      - flux-system/flux-operator
    hooks:
      - command: sh
        args:
          - -c
          - |
            set -eu
            for f in ../../kubernetes/apps/{{ .Release.Namespace }}/{{ .Release.Name | replace "-" "/" }}/secret-*.sops.yaml; do
              sops --decrypt "$f" | kubectl apply --namespace={{ .Release.Namespace }} --server-side --force-conflicts --filename -
            done
        events:
          - presync
