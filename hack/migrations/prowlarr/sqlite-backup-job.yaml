---
# MANUAL APPLY ONLY -- not referenced by any kustomization, so Flux ignores it.
#
# Captures a consistent copy of Prowlarr's SQLite database onto the prowlarr-backup
# NFS volume so it can later be loaded into the new CNPG cluster with pgloader.
#
# The config PVC is RWO (ceph-block), so Prowlarr must release it first:
#   kubectl -n download scale statefulset/prowlarr --replicas=0
#   kubectl -n download wait --for=delete pod -l app.kubernetes.io/name=prowlarr --timeout=120s
#   kubectl apply -f hack/migrations/prowlarr/sqlite-backup-job.yaml
#   kubectl -n download wait --for=condition=complete job/prowlarr-sqlite-backup --timeout=300s
#   kubectl -n download logs job/prowlarr-sqlite-backup
#   kubectl -n download scale statefulset/prowlarr --replicas=1
#
# Output lands on the NAS at /volume1/backups/prowlarr/sqlite-migration/<timestamp>/
apiVersion: batch/v1
kind: Job
metadata:
  name: prowlarr-sqlite-backup
  namespace: download
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr-sqlite-backup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backup
          image: docker.io/library/alpine:3.21
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              ts="$(date +%Y%m%d-%H%M%S)"
              dest="/backup/sqlite-migration/${ts}"
              if [ ! -f /config/prowlarr.db ]; then
                echo "ERROR: /config/prowlarr.db not found -- is Prowlarr scaled to 0 and the config PVC mounted?" >&2
                exit 1
              fi
              mkdir -p "${dest}"
              cp -av /config/prowlarr.db* "${dest}/"
              sync
              echo "---"
              ls -l "${dest}"
              echo "SQLite backup complete: ${dest}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: backup
              mountPath: /backup
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
        - name: backup
          persistentVolumeClaim:
            claimName: prowlarr-backup
