---
# MANUAL APPLY ONLY -- not referenced by any kustomization, so Flux ignores it.
# Safety snapshot of Sonarr's restored SQLite DB onto the sonarr-backup NFS volume.
#
# Sonarr's config PVC is restored from volsync, so the SQLite lives at /config/sonarr.db.
# The config PVC is RWO, so Sonarr must release it first:
#   kubectl -n download scale sts/sonarr --replicas=0
#   kubectl -n download wait --for=delete pod -l app.kubernetes.io/name=sonarr --timeout=120s
#   kubectl apply -f hack/migrations/sonarr/sqlite-backup-job.yaml
#   kubectl -n download logs job/sonarr-sqlite-backup
apiVersion: batch/v1
kind: Job
metadata:
  name: sonarr-sqlite-backup
  namespace: download
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr-sqlite-backup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backup
          image: docker.io/library/alpine:3.24
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              ts="$(date +%Y%m%d-%H%M%S)"
              dest="/backup/sqlite-migration/${ts}"
              if [ ! -f /config/sonarr.db ]; then
                echo "ERROR: /config/sonarr.db not found -- is Sonarr scaled to 0 and the config PVC mounted?" >&2
                exit 1
              fi
              mkdir -p "${dest}"
              cp -av /config/sonarr.db* "${dest}/"
              sync
              echo "---"
              ls -l "${dest}"
              echo "SQLite backup complete: ${dest}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: backup
              mountPath: /backup
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: backup
          persistentVolumeClaim:
            claimName: sonarr-backup
