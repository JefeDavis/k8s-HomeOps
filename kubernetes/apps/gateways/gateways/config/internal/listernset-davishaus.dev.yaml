---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: internal.davishaus.dev
  namespace: gateways
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: internal-gateway
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.internal.davishaus.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: internal.davishaus.dev-tls
      allowedRoutes:
        namespaces:
          from: All
