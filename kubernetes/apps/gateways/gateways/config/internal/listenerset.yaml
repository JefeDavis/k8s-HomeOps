---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: internal
  namespace: gateways
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: internal-gateway
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: internal-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: internal-https
      protocol: HTTPS
      port: 443
      hostname: "*.internal.${DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: internal-tls
      allowedRoutes:
        namespaces:
          from: All
