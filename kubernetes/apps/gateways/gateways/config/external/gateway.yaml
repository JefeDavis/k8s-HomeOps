---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-gateway
  namespace: gateways
spec:
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: 192.168.77.22
  gatewayClassName: envoy
  allowedListeners:
    namespaces:
      from: All
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
