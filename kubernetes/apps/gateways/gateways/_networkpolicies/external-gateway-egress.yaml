---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-gateway-egress
  namespace: gateways
spec:
  description: >-
    Allows the external gateway to send traffic to the backend pods.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/managed-by: envoy-gateway
      k8s:gateway.networking.k8s.io/gateway-name: external-gateway
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:ingress.gateway.homeops.io/external: "true"
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
