---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gateway-ingress-world
  namespace: gateways
spec:
  description: >-
    Allows external clients via the load balancer, plus node-local health checks, to reach the
    envoy-gateway-managed Envoy proxies (north-south ingress). Exposed ports are governed by the
    Gateway and ListenerSet listeners, so this rule is intentionally port-agnostic.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/managed-by: envoy-gateway
  ingress:
    - fromEntities:
        - world
        - host
        - remote-node
