---
apiVersion: v1
kind: Endpoints
metadata:
  name: nas
subsets:
  - addresses:
      - ip: 10.77.0.2
    ports:
      - name: http
        port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: nas
spec:
  ports:
    - name: http
      port: 5000
      protocol: TCP
      targetPort: 5000
      appProtocol: https
