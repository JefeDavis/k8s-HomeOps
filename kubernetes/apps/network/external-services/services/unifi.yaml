---
apiVersion: v1
kind: Endpoints
metadata:
  name: unifi
subsets:
  - addresses:
      - ip: 10.0.1.1
    ports:
      - name: http
        port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: unifi
spec:
  ports:
    - name: http
      port: 443
      targetPort: 443
      protocol: TCP
      appProtocol: https
