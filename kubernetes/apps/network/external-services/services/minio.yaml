---
apiVersion: v1
kind: Endpoints
metadata:
  name: minio
subsets:
  - addresses:
      - ip: 10.77.0.2
    ports:
      - name: http
        port: 9090
      - name: minio
        port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  ports:
    - name: http
      port: 9090
      protocol: TCP
      targetPort: 9090
      appProtocol: https
    - name: minio
      port: 9000
      protocol: TCP
      targetPort: 9000
