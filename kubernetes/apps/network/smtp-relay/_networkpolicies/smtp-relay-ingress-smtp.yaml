---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: smtp-relay-ingress-smtp
  namespace: network
spec:
  description: >-
    Allows vaultwarden to submit mail to smtp-relay on 2525. Off-cluster senders arrive via the
    internal gateway's TCPRoute and are covered by the clusterwide allow-ingress-internal-gateway
    policy.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: smtp-relay
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: vaultwarden
            k8s:app.kubernetes.io/name: vaultwarden
      toPorts:
        - ports:
            - port: "2525"
              protocol: TCP
