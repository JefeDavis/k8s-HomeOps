---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: smtp-relay
  namespace: network
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: internal-gateway
    namespace: gateways
  listeners:
    - name: smtp
      protocol: TCP
      port: 2525
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Same
