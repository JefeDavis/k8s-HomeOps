---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
  namespace: spegel-system
spec:
  chartRef:
    kind: OCIRepository
    name: spegel
    namespace: spegel-system
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    priorityClassName: platform-node-critical

    serviceMonitor:
      enabled: true

    grafanaDashboard:
      enabled: true

    securityContext:
      seccompProfile:
        type: RuntimeDefault
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi

    service:
      registry:
        usePreferSameNodeTrafficDistribution: true

    spegel:
      resolveTags: false
      containerdSock: /run/containerd/containerd.sock
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts

    extraVolumes:
      - name: serviceaccount-token
        projected:
          defaultMode: 0444
          sources:
            - serviceAccountToken:
                expirationSeconds: 3607
                path: token
            - configMap:
                name: kube-root-ca.crt
                items:
                  - key: ca.crt
                    path: ca.crt
            - downwardAPI:
                items:
                  - path: namespace
                    fieldRef:
                      fieldPath: metadata.namespace
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
            patch: |
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
          - target:
              kind: ServiceAccount
            patch: |
              - op: add
                path: /automountServiceAccountToken
                value: false
