---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-config
  namespace: envoy-gateway
spec:
  telemetry:
    metrics:
      prometheus: {}
    # Structured JSON access logs to stdout (tailed by the alloy-logs DaemonSet -> Loki), matching
    # the istio mesh access-log format so gateway and mesh logs parse uniformly. The match drops
    # kube-probe health/readiness traffic (mirrors the mesh-default Telemetry filter) to cut volume.
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              duration: "%DURATION%"
              upstream_service_time: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              authority: "%REQ(:AUTHORITY)%"
              request_id: "%REQ(X-REQUEST-ID)%"
              user_agent: "%REQ(USER-AGENT)%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_cluster: "%UPSTREAM_CLUSTER%"
              downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
              requested_server_name: "%REQUESTED_SERVER_NAME%"
              route_name: "%ROUTE_NAME%"
          matches:
            - "!('user-agent' in request.headers && request.headers['user-agent'].startsWith('kube-probe'))"
          sinks:
            - type: File
              file:
                path: /dev/stdout
    # Export request traces (OTLP) to the alloy-traces collector when the tempo backend exists.
    # backendRefs is the supported reference (host/port is deprecated); the cross-namespace ref to
    # the alloy-traces Service is authorized by a ReferenceGrant delivered by the alloy module.
    tracing:
      samplingRate: 100
      provider:
        type: OpenTelemetry
        backendRefs:
          - group: ""
            kind: Service
            name: alloy-traces
            namespace: alloy
            port: 4317
  shutdown:
    drainTimeout: 300s
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      # Drain-safe budget for the managed proxy fleet: at most one Envoy pod unavailable during
      # voluntary disruptions (node drains/updates). Cannot be combined with minAvailable.
      envoyPDB:
        maxUnavailable: 1
      envoyHpa:
        minReplicas: 2
        maxReplicas: 6
      envoyDeployment:
        pod:
          # The managed Envoy fleet is the live north-south ingress data plane: its loss drops external
          # traffic instantly, so it is platform-critical (the control plane in app/chart stays high).
          priorityClassName: platform-critical
          # Spread the managed Envoy fleet across nodes (soft on metal single-node clusters).
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: envoy-gateway
          volumes:
            - name: tmp
              emptyDir: {}
            # Coraza dynamic module (.so) delivered read-only via an OCI image volume.
            - name: dynamic-modules
              image:
                reference: ghcr.io/tetratelabs/built-on-envoy/composer:0.11.0
                pullPolicy: IfNotPresent
        container:
          env:
            - name: GODEBUG
              value: "cgocheck=0"
          resources:
            requests:
              cpu: 150m
              memory: 640Mi
            limits:
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dynamic-modules
              mountPath: /etc/envoy/dynamic-modules
              readOnly: true
            # Coraza buffers request/response bodies here (SecTmpDir/SecDataDir default /tmp) and
            # the rootfs is read-only.
            - name: tmp
              mountPath: /tmp
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  automountServiceAccountToken: false
                  containers:
                    - name: shutdown-manager
                      # ~20Mi observed; memory-only limit (ADR-0010).
                      resources:
                        requests:
                          cpu: 10m
                          memory: 32Mi
                        limits:
                          memory: 64Mi
                      volumeMounts:
                        - name: tmp
                          mountPath: /tmp
      envoyService:
        externalTrafficPolicy: Cluster
  # Allowlist of dynamic modules the proxy may load. The `waf-extension` EnvoyExtensionPolicy
  # references the `composer` entry by name; a policy naming an unregistered module is rejected.
  dynamicModules:
    - name: composer
      source:
        type: Local
        local:
          path: /etc/envoy/dynamic-modules/libcomposer.so
      doNotClose: true
      loadGlobally: false
