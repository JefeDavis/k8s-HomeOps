---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-gateway-certgen-egress-kube-api
  namespace: envoy-gateway
spec:
  description: >-
    Allows the envoy-gateway certgen Job to reach the API server to generate its initial
    secrets.
  endpointSelector:
    matchLabels:
      k8s:job-name: envoy-gateway-certgen
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
