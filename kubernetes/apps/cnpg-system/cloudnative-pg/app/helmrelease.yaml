---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
    namespace: cnpg-system
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    replicaCount: 2
    priorityClassName: platform-high
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
        matchLabelKeys:
          - pod-template-hash
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    monitoring:
      podMonitorEnabled: true
      grafanaDashboard:
        create: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ServiceAccount
            patch: |
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: cloudnative-pg
              automountServiceAccountToken: false

          - target:
              kind: Deployment
              labelSelector: app.kubernetes.io/name=cloudnative-pg
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: cloudnative-pg
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
                    containers:
                      - name: manager
                        volumeMounts:
                          - name: serviceaccount-token
                            mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                            readOnly: true
                    volumes:
                      - name: serviceaccount-token
                        projected:
                          defaultMode: 0444
                          sources:
                            - serviceAccountToken:
                                expirationSeconds: 3607
                                path: token
                            - configMap:
                                name: kube-root-ca.crt
                                items:
                                  - key: ca.crt
                                    path: ca.crt
                            - downwardAPI:
                                items:
                                  - path: namespace
                                    fieldRef:
                                      apiVersion: v1
                                      fieldPath: metadata.namespace
