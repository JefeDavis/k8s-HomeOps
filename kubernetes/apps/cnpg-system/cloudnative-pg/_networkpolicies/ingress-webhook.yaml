---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress-webhook
  namespace: cnpg-system
spec:
  description: >-
    Allows the API server to reach the cnpg operator admission/conversion webhook.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: cloudnative-pg
  ingress:
    # Cross-node API server webhook calls egress via the remote node's
    # CiliumInternalIP, which carries the `remote-node` identity (only the node's
    # primary IP gets the `kube-apiserver` label), so remote-node is required too.
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
