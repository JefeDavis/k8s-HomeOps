---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-kube-api
  namespace: cnpg-system
spec:
  description: >-
    Allows the cnpg operator and plugin to reach the API server (watch Clusters, manage instance resources).
  endpointSelector:
    matchExpressions:
      - key: k8s:app.kubernetes.io/name
        operator: In
        values:
          - cloudnative-pg
          - plugin-barman-cloud
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
