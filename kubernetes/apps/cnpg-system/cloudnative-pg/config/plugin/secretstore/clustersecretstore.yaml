---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cnpg-objectstore
spec:
  provider:
    kubernetes:
      remoteNamespace: cnpg-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: cnpg-system
          key: ca.crt
      auth:
        serviceAccount:
          name: cloudnative-pg-secret-reader
          namespace: cnpg-system
