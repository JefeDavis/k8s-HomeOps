---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: snapshot-controller-ingress-metrics
  namespace: kube-system
spec:
  description: >-
    Allows the alloy-metrics collector to scrape, and the kubelet to probe, the
    snapshot-controller on 8080.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: snapshot-controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alloy
            k8s:app.kubernetes.io/name: alloy
            k8s:app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
