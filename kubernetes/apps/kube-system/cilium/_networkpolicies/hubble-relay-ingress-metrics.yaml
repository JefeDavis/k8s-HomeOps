---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hubble-relay-ingress-metrics
  namespace: kube-system
spec:
  description: >-
    Allows the alloy-metrics collector to scrape hubble-relay metrics (:9966).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: hubble-relay
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alloy
            k8s:app.kubernetes.io/name: alloy
            k8s:app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - port: "9966"
              protocol: TCP
