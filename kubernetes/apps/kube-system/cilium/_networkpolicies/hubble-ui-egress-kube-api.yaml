---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hubble-ui-egress-kube-api
  namespace: kube-system
spec:
  description: >-
    Allows the hubble-ui backend to list namespaces from the API server.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: hubble-ui
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
