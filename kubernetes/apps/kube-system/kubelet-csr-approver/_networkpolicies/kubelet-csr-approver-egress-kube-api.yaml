---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubelet-csr-approver-egress-kube-api
  namespace: kube-system
spec:
  description: >-
    Allows kubelet-csr-approver to watch and approve kubelet serving CSRs via the API server.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: kubelet-csr-approver
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
