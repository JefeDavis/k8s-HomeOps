---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-server-egress-kubelet
  namespace: kube-system
spec:
  description: >-
    Allows metrics-server to scrape the kubelet summary API on every node (10250).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: metrics-server
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
