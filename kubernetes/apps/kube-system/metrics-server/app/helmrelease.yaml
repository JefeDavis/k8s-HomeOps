---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 1h
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: metrics-server
    namespace: kube-system
  values:
    priorityClassName: platform-high
    args:
      - --logging-format=json
    # The chart sets requests (cpu 100m/memory 200Mi) but no limit; restate them and add a memory-only
    # limit so the aggregation server is capped without CPU throttling.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    # Stateless aggregation-API server, safe active-active.
    replicas: 2
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: metrics-server
            app.kubernetes.io/instance: metrics-server
        matchLabelKeys:
          - pod-template-hash
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
    tls:
      type: cert-manager
    apiService:
      insecureSkipTLSVerify: false
    extraVolumeMounts:
      - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        name: serviceaccount-token
        readOnly: true
    extraVolumes:
      - name: serviceaccount-token
        projected:
          defaultMode: 0444
          sources:
            - serviceAccountToken:
                expirationSeconds: 3607
                path: token
            - configMap:
                name: kube-root-ca.crt
                items:
                  - key: ca.crt
                    path: ca.crt
            - downwardAPI:
                items:
                  - path: namespace
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.namespace
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
          - target:
              kind: ServiceAccount
            patch: |
              - op: add
                path: /automountServiceAccountToken
                value: false
