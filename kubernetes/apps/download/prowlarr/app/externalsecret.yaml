---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr
  namespace: download
spec:
  # ESO re-invokes the generator on each refresh, so this is the API-key rotation cadence.
  refreshInterval: 24h
  target:
    name: prowlarr
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        apiKey: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: api-key-generator
