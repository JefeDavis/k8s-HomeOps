---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prowlarr-backup
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
    - nodiratime
  nfs:
    server: 10.77.0.2
    path: /volume1/backups/prowlarr
  claimRef:
    name: prowlarr-backup
    namespace: download
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-backup
  namespace: download
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: prowlarr-backup
  resources:
    requests:
      storage: 10Gi
