---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sonarr
  namespace: download
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sonarr
    namespace: download
  driftDetection:
    mode: enabled
  values:
    controllers:
      *app :
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            logs.observability.home.arpa/format: starr
          labels:
            ingress.policy.home.arpa/internal-gateway: "true"
        containers:
          *app :
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.3041@sha256:ec7797f30e65cc411fba6768ed575337a5787de7d06c382173df610f2d23a317
            env:
              TZ: ${TIMEZONE}
              SONARR__APP__INSTANCENAME: Sonarr
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
              SONARR__SERVER__PORT: &port 8989
              SONARR__SERVER__ALLOWEDHOSTS: "sonarr.internal.${DOMAIN},sonarr.download.svc.cluster.local,sonarr.download.svc,sonarr"
              SONARR__APPLICATION_URL: "https://sonarr.internal.${DOMAIN}"
              SONARR__LOG__LEVEL: info
              SONARR__LOG__DBENABLED: "False"
              SONARR__POSTGRES__MAINDB: sonarr
              SONARR__POSTGRES__HOST: pg-download-rw
              SONARR__POSTGRES__PORT: "5432"
              SONARR__POSTGRES__USER:
                valueFrom:
                  secretKeyRef:
                    name: pg-sonarr-app
                    key: username
              SONARR__POSTGRES__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: pg-sonarr-app
                    key: password
              SONARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}"
                    key: apiKey
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: localhost
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 192Mi
              limits:
                memory: 256Mi
          exporter:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0
            args:
              - sonarr
              - --enable-additional-metrics
              - --log-format=json
            env:
              URL: "http://localhost:8989"
              PORT: &metricsPort 9710
              APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}"
                    key: apiKey
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 96Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: "RuntimeDefault" }

    serviceAccount:
      *app :
        automountServiceAccountToken: false

    service:
      *app :
        controller: *app
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort

    serviceMonitor:
      metrics:
        enabled: true
        serviceName: *app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s

    route:
      *app :
        enabled: true
        kind: HTTPRoute
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/icon: "mdi:television"
        parentRefs:
          - kind: ListenerSet
            name: internal
            namespace: gateways
        hostnames:
          - sonarr.internal.${DOMAIN}
        rules:
          - backendRefs:
              - kind: Service
                identifier: *app
                port: http
            matches:
              - path:
                  type: PathPrefix
                  value: /

    persistence:
      config:
        existingClaim: ${KOPIUR_CLAIM}

      media:
        existingClaim: media-nfs

      tmp:
        type: emptyDir

      backup:
        existingClaim: sonarr-backup
        globalMounts:
          - path: /config/Backups
