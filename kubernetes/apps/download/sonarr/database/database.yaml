---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: sonarr
  namespace: download
spec:
  cluster:
    name: pg-download
  name: sonarr
  ensure: present
  login: true
  passwordSecret:
    name: pg-sonarr-app
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: sonarr
  namespace: download
spec:
  cluster:
    name: pg-download
  name: sonarr
  owner: sonarr
  ensure: present
  databaseReclaimPolicy: retain
