---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lidarr
  namespace: download
spec:
  # Generate the API key once and never rotate it: Prowlarr<->*arr integrations reference this
  # key and can't be re-pushed automatically yet, so rotation would break them.
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: lidarr
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        apiKey: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: api-key-generator
