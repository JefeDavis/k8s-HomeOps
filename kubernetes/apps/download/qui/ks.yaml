---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qui
  namespace: download
spec:
  targetNamespace: download
  interval: 1h
  path: "./kubernetes/apps/download/qui/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-homeops
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
  wait: true
  dependsOn:
    - name: download-storage
      namespace: download
    - name: qui-database
      namespace: download
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qui-database
  namespace: download
spec:
  targetNamespace: download
  interval: 1h
  path: "./kubernetes/apps/download/qui/database"
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-homeops
    namespace: flux-system
  wait: true
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: has(status.applied) && status.applied
      failed: has(status.applied) && !status.applied
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: has(status.applied) && status.applied
      failed: has(status.applied) && !status.applied
  dependsOn:
    - name: download-storage
      namespace: download
