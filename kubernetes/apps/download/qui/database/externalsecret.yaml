---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-qui
  namespace: download
spec:
  refreshInterval: 24h
  target:
    name: pg-qui-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: qui
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: database-password-generator
