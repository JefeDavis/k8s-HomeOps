---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rdt-client-media
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
    - nodiratime
  nfs:
    server: 10.77.0.2
    path: /volume1/media/downloads
  claimRef:
    name: rdt-client-media
    namespace: download
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rdt-client-media
  namespace: download
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: rdt-client-media
  resources:
    requests:
      storage: 1Ti
