---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app recyclarr
  namespace: download
spec:
  targetNamespace: download
  interval: 1h
  path: "./kubernetes/apps/download/recyclarr/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-homeops
    namespace: flux-system
  wait: true
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: radarr
      namespace: download
    - name: sonarr
      namespace: download
