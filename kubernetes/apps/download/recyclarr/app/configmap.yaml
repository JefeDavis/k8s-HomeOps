---
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-configmap
  namespace: download
data:
  recyclarr.yml: |
    # yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/refs/tags/v9.0.0/schemas/config-schema.json
    radarr:
      radarr:
        base_url: http://radarr.download.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY
        delete_old_custom_formats: true
        quality_definition:
          type: sqp-uhd
        quality_profiles:
          - name: HD-1080p
            trash_id: 0896c29d74de619df168d23b98104b22 # [SQP] SQP-1 (1080p)
            reset_unmatched_scores:
              enabled: true
          - name: Ultra-HD-2160p
            trash_id: 5128baeb2b081b72126bc8482b2a86a0 # [SQP] SQP-1 (2160p)
            reset_unmatched_scores:
              enabled: true
        custom_formats:
          - trash_ids:
              - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
              - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
              - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
              - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
              - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
              - f537cf427b64c38c8e36298f657e4828 # Scene
            assign_scores_to:
              - name: HD-1080p
              - name: Ultra-HD-2160p

    sonarr:
      sonarr:
        base_url: http://sonarr.download.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY
        delete_old_custom_formats: true
        quality_definition:
          type: series
        quality_profiles:
          - name: HD-1080p
            trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
            reset_unmatched_scores:
              enabled: true
          - name: Ultra-HD-2160p
            trash_id: c4cadd6b35b95f62c3d47a408e53e2f7 # WEB-2160p (Combined)
            reset_unmatched_scores:
              enabled: true
          - name: HD-1080p-Anime
            trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
            reset_unmatched_scores:
              enabled: true
        custom_formats:
          - trash_ids:
              - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
              - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
              - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
              - 06d66ab109d4d2eddb2794d21526d140 # Retags
            assign_scores_to:
              - name: HD-1080p
              - name: Ultra-HD-2160p
          - trash_ids:
              - 418f50b10f1907201b6cfdf881f467b7 # Anime Dual Audio
            assign_scores_to:
              - name: HD-1080p-Anime
                score: 2000
          - trash_ids:
              - 026d5aadd1a6b4e550b134cb6c72b3ca # Uncensored
            assign_scores_to:
              - name: HD-1080p-Anime
                score: 101
          - trash_ids:
              - 9c14d194486c4014d422adc64092d794 # Dubs Only
            assign_scores_to:
              - name: HD-1080p-Anime
                score: -10000
          - trash_ids:
              - b4a1b3d705159cdca36d71e57ca86871 # Anime Raws
            assign_scores_to:
              - name: HD-1080p-Anime
                score: -10000
          - trash_ids:
              - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
            assign_scores_to:
              - name: HD-1080p-Anime
                score: -10000
          - trash_ids:
              - 07a32f77690263bb9fda1842db7e273f # VOSTFR
            assign_scores_to:
              - name: HD-1080p-Anime
                score: -10000
