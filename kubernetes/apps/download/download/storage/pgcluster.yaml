---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-download
spec:
  instances: 3
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 18
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 512Mi
  # Shared cluster: per-app databases/roles are declared by each tenant (see prowlarr/database).
  # initdb only creates the default bootstrap database.
  bootstrap:
    initdb: {}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-download
        serverName: pg-download-blue
