---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bazarr
  namespace: download
spec:
  targetNamespace: download
  interval: 1h
  path: "./kubernetes/apps/download/bazarr/app"
  components:
    - ../../../../components/volsync
    - ../../../../components/kopiur-migration
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-homeops
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CLAIM: bazarr-config
      VOLSYNC_CAPACITY: 10Gi
      KOPIUR_CLAIM: bazarr-config
      KOPIUR_CAPACITY: 10Gi
  wait: true
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
    - name: download-storage
      namespace: download
    - name: bazarr-database
      namespace: download
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bazarr-database
  namespace: download
spec:
  targetNamespace: download
  interval: 1h
  path: "./kubernetes/apps/download/bazarr/database"
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-homeops
    namespace: flux-system
  wait: true
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: has(status.applied) && status.applied
      failed: has(status.applied) && !status.applied
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: has(status.applied) && status.applied
      failed: has(status.applied) && !status.applied
  dependsOn:
    - name: download-storage
      namespace: download
