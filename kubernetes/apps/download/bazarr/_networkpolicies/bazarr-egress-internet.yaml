---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bazarr-egress-internet
  namespace: download
spec:
  description: >-
    Bazarr reaches external subtitle providers (OpenSubtitles, etc.) over HTTPS/HTTP. It is not
    routed through the gluetun VPN, so egress is permitted directly to the world on 443/80.
    In-cluster talk to sonarr/radarr rides the ambient mesh (ztunnel); ingress from the internal
    gateway is granted by the ingress.policy.home.arpa/internal-gateway label (global policy).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: bazarr
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
