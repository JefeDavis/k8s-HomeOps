---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: autobrr
  namespace: download
spec:
  cluster:
    name: pg-download
  name: autobrr
  ensure: present
  login: true
  passwordSecret:
    name: pg-autobrr-app
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: autobrr
  namespace: download
spec:
  cluster:
    name: pg-download
  name: autobrr
  owner: autobrr
  ensure: present
  databaseReclaimPolicy: retain
