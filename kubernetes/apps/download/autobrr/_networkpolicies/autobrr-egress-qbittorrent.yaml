---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: autobrr-egress-qbittorrent
  namespace: download
spec:
  description: >-
    autobrr pushes approved releases to the qbittorrent WebUI/API on 8080. qbittorrent is excluded from
    the ambient mesh (the gluetun sidecar owns its network namespace), so this talk is direct rather
    than tunneled through ztunnel and needs an explicit CNI-layer egress allow.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: autobrr
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: qbittorrent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
