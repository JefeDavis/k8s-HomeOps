---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alloy-traces-egress-tempo
  namespace: alloy
spec:
  description: >-
    Allows alloy-traces to export received traces to the tempo backend over OTLP gRPC (:4317).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: alloy-traces
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: tempo
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
