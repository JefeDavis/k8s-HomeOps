---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alloy-logs-egress-loki
  namespace: alloy
spec:
  description: >-
    Allows alloy-logs to push logs to the loki gateway (nginx, container port 8080). Logs are
    tailed from the host filesystem, so there is no scrape egress.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: alloy-logs
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: loki
            k8s:app.kubernetes.io/name: loki
            k8s:app.kubernetes.io/component: gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
