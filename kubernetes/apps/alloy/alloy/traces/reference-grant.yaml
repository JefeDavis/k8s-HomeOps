---
# Authorizes the envoy-gateway EnvoyProxy (in gateway-system) to reference the alloy-traces
# Service across namespaces as its OTLP tracing backend. Required because EnvoyProxy telemetry
# backendRefs enforce Gateway API cross-namespace ReferenceGrants.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: envoy-gateway-traces
  namespace: alloy
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: EnvoyProxy
      namespace: gateway-system
  to:
    - group: ""
      kind: Service
      name: alloy-traces
