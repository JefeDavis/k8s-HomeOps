---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: library-nfs
spec:
  capacity:
    storage: 64Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
    - nodiratime
  nfs:
    server: 10.77.0.2
    path: /volume1/media/library
  claimRef:
    name: library-nfs
    namespace: media
