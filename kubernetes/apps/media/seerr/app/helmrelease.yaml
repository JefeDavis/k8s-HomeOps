---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app seerr
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: seerr
    namespace: media
  driftDetection:
    mode: enabled
  values:
    controllers:
      *app :
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            logs.observability.home.arpa/format: plain
          labels:
            ingress.policy.home.arpa/external-gateway: "true"
        containers:
          *app :
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
            env:
              TZ: ${TIMEZONE}
              LOG_LEVEL: info
              PORT: &port 5055
              # SQLite (default). To move to Postgres later, add DB_TYPE=postgres + DB_HOST/USER/PASS/NAME
              # and run the pgloader job in hack/migrations/seerr/.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              # seerr is a Node/Next.js app that writes under /app at runtime; it runs as its
              # own node user (1000), so the rootfs stays writable (unlike the *arr apps).
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: "RuntimeDefault" }

    serviceAccount:
      *app :
        automountServiceAccountToken: false

    service:
      *app :
        controller: *app
        ports:
          http:
            port: *port

    route:
      *app :
        enabled: true
        kind: HTTPRoute
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/icon: "mdi:play-network"
        parentRefs:
          - kind: ListenerSet
            name: external
            namespace: gateways
        hostnames:
          - "request.${DOMAIN}"
        rules:
          - backendRefs:
              - kind: Service
                identifier: *app
                port: http
            matches:
              - path:
                  type: PathPrefix
                  value: /

    persistence:
      config:
        existingClaim: ${KOPIUR_CLAIM}
        globalMounts:
          - path: /app/config
