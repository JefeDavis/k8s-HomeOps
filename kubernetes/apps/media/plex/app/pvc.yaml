---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-backup
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
    - nodiratime
  nfs:
    server: 10.77.0.2
    path: /volume1/backups/plex
  claimRef:
    name: plex-backup
    namespace: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-backup
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: plex-backup
  resources:
    requests:
      storage: 100Gi
