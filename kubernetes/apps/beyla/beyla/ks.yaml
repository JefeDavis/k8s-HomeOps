---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: beyla-exceptions
  namespace: beyla
spec:
  targetNamespace: kyverno-exceptions
  interval: 1h
  path: "./kubernetes/apps/beyla/beyla/exceptions"
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-homeops
    namespace: flux-system
  wait: true
  dependsOn:
    - name: kyverno
      namespace: kyverno
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: beyla
  namespace: beyla
spec:
  targetNamespace: beyla
  interval: 1h
  path: "./kubernetes/apps/beyla/beyla/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-homeops
    namespace: flux-system
  wait: true
  dependsOn:
    - name: beyla-exceptions
      namespace: beyla
