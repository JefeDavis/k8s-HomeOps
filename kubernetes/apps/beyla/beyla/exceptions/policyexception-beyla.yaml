---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: beyla
  namespace: kyverno-exceptions
  annotations:
    policies.kyverno.io/justification: >-
      Beyla is an eBPF auto-instrumentation DaemonSet: it needs hostPID + hostNetwork to
      observe and instrument application processes across the node, eBPF capabilities
      (BPF/PERFMON/SYS_PTRACE/NET_RAW/DAC_READ_SEARCH/CHECKPOINT_RESTORE and NET_ADMIN/SYS_ADMIN
      for context propagation), root uid (eBPF program loading), and read-only hostPath mounts of
      cgroupfs and tracefs. It is NOT privileged, runs read-only root, drops ALL other capabilities,
      sets allowPrivilegeEscalation=false, and uses RuntimeDefault seccomp. These are the only
      restricted deviations.
spec:
  matchConditions:
    - expression: >-
        has(object.metadata.labels) && ("app.kubernetes.io/name" in object.metadata.labels)
        && object.metadata.labels["app.kubernetes.io/name"] == "beyla"
      name: match-labels
  policyRefs:
    - kind: ValidatingPolicy
      name: disallow-host-namespaces
    - kind: ValidatingPolicy
      name: disallow-host-path
    - kind: ValidatingPolicy
      name: restrict-volume-types
    - kind: ValidatingPolicy
      name: disallow-capabilities-strict
    - kind: ValidatingPolicy
      name: require-run-as-nonroot
    - kind: ValidatingPolicy
      name: require-run-as-non-root-user
  reportResult: skip
