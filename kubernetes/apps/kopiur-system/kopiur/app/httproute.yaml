---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kopiur-ui
  namespace: kopiur-system
  annotations:
    hajimari.io/enable: "true"
    hajimari.io/icon: "simple-icons:kopia"
  labels:
    app.kubernetes.io/instance: kopiur
    app.kubernetes.io/name: kopiur
    app.kubernetes.io/component: ui
spec:
  hostnames:
    - kopiur.internal.${DOMAIN}
  parentRefs:
    - kind: ListenerSet
      name: internal
      namespace: gateways
  rules:
    - backendRefs:
        - kind: Service
          name: kopiur-ui
          port: 8090
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
