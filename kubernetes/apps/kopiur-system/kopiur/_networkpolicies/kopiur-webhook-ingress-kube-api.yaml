---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kopiur-webhook-ingress-kube-api
  namespace: kopiur-system
spec:
  description: >-
    Allows the API server to reach the kopiur admission webhook on 8443.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: kopiur
      k8s:app.kubernetes.io/component: webhook
  ingress:
    # Cross-node API server webhook calls egress via the remote node's
    # CiliumInternalIP, which carries the `remote-node` identity (only the node's
    # primary IP gets the `kube-apiserver` label), so remote-node is required too.
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
