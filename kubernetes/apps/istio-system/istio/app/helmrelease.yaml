---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio
  namespace: istio-system
spec:
  chartRef:
    kind: OCIRepository
    name: istio
    namespace: istio-system
  interval: 1h
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /webhooks/0/failurePolicy
        target:
          kind: ValidatingWebhookConfiguration
          name: istio-validator-istio-system

  values:
    global:
      logAsJson: true
      priorityClassName: platform-critical
      proxy:
        seccompProfile:
          type: RuntimeDefault

    profile: ambient

    # istio-cni handles pod traffic redirection in both modes, so injected sidecars need no
    # NET_ADMIN init container under the restricted PSS.
    cni:
      enabled: true
    seccompProfile:
      type: RuntimeDefault
    meshConfig:
      # Access logs stream to stdout (tailed by the alloy-logs DaemonSet -> Loki). JSON encoding makes
      # the fields parseable in Loki/Grafana. This applies to every Envoy-based proxy (injected
      # sidecars, waypoints, and the istio ingress gateway); ztunnel emits its own fixed-shape L4
      # connection logs and does NOT honor this format. Probe traffic is dropped by the mesh-default
      # Telemetry accessLogging filter (config/telemetry.yaml), so this format only shapes real logs.
      accessLogFile: /dev/stdout
      accessLogEncoding: JSON
      accessLogFormat: |
        {
          "start_time": "%START_TIME%",
          "method": "%REQ(:METHOD)%",
          "path": "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%",
          "protocol": "%PROTOCOL%",
          "response_code": "%RESPONSE_CODE%",
          "response_flags": "%RESPONSE_FLAGS%",
          "response_code_details": "%RESPONSE_CODE_DETAILS%",
          "duration": "%DURATION%",
          "upstream_service_time": "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%",
          "bytes_received": "%BYTES_RECEIVED%",
          "bytes_sent": "%BYTES_SENT%",
          "authority": "%REQ(:AUTHORITY)%",
          "request_id": "%REQ(X-REQUEST-ID)%",
          "user_agent": "%REQ(USER-AGENT)%",
          "upstream_host": "%UPSTREAM_HOST%",
          "upstream_cluster": "%UPSTREAM_CLUSTER%",
          "downstream_remote_address": "%DOWNSTREAM_REMOTE_ADDRESS%",
          "requested_server_name": "%REQUESTED_SERVER_NAME%",
          "route_name": "%ROUTE_NAME%"
        }
      extensionProviders:
        - name: otel-tracing
          opentelemetry:
            port: 4317
            service: alloy-traces.alloy.svc.cluster.local
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1024Mi
    # Projected, short-lived SA token; pairs with automountServiceAccountToken:false (postRenderers).
    volumes:
      - name: serviceaccount-token
        projected:
          defaultMode: 444
          sources:
            - serviceAccountToken:
                expirationSeconds: 3607
                path: token
            - configMap:
                name: kube-root-ca.crt
                items:
                  - key: ca.crt
                    path: ca.crt
            - downwardAPI:
                items:
                  - path: namespace
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.namespace
    volumeMounts:
      - name: serviceaccount-token
        mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        readOnly: true

    sidecarInjectorWebhookAnnotations:
      admissions.enforcer/disabled: "true"

    pilot:
      autoscaleMin: 2
      # Drain-safe budget: at most one istiod pod unavailable during voluntary disruptions. pdb (not
      # podDisruptionBudget) is the key the chart reads; clear minAvailable so both are never set.
      pdb:
        minAvailable: ""
        maxUnavailable: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              istio: pilot
          matchLabelKeys:
            - pod-template-hash
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
          - target:
              kind: ServiceAccount
            patch: |
              - op: add
                path: /automountServiceAccountToken
                value: false
