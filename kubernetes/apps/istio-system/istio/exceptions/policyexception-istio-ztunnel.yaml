apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: istio-ztunnel
  namespace: kyverno-exceptions
  annotations:
    policies.secondfront.io/justification:
      Istio ambient ztunnel is the per-node L4
      mTLS proxy; it requires elevated capabilities, host path access and root to
      capture and redirect node traffic; this is the upstream ztunnel DaemonSet's
      required posture.
spec:
  matchConditions:
    - expression:
        has(object.metadata.labels) && ("app.kubernetes.io/name" in object.metadata.labels)
        && object.metadata.labels["app.kubernetes.io/name"] == "ztunnel"
      name: match-labels
  policyRefs:
    - kind: ValidatingPolicy
      name: disallow-capabilities
    - kind: ValidatingPolicy
      name: disallow-capabilities-strict
    - kind: ValidatingPolicy
      name: disallow-host-path
    - kind: ValidatingPolicy
      name: disallow-privilege-escalation
    - kind: ValidatingPolicy
      name: require-run-as-nonroot
    - kind: ValidatingPolicy
      name: require-run-as-non-root-user
    - kind: ValidatingPolicy
      name: restrict-volume-types
  reportResult: skip
