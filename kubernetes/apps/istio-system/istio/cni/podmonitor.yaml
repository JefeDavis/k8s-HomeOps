---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-cni
  namespace: istio-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: istio-cni
  jobLabel: istio-cni
  namespaceSelector:
    matchNames:
      - istio-system
  podMetricsEndpoints:
    - interval: 15s
      port: metrics
