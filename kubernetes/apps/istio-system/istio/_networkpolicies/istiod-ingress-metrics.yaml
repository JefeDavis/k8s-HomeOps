---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: istiod-ingress-metrics
  namespace: istio-system
spec:
  description: >-
    Allows observability stack to scrape istiod metrics.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: istiod
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alloy
            k8s:app.kubernetes.io/name: alloy
            k8s:app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - port: "http-monitoring" # istiod metrics
              protocol: TCP
