---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: istiod-ingress-xds
  namespace: istio-system
spec:
  description: >-
    Allows every mesh proxy (ambient ztunnel and classic sidecars) to reach istiod xDS/SDS/CA.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: istiod
  ingress:
    # xDS + SDS (config + certs) from every mesh proxy: ambient ztunnel AND classic
    # sidecars in istio-injection=enabled namespaces. `cluster` = proxies in any
    # workload namespace, so both data-plane modes reach the control plane.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "15012" # xDS + SDS + CA (mTLS)
              protocol: TCP
            - port: "15010" # xDS plaintext (off under strict mTLS; kept for parity)
              protocol: TCP
