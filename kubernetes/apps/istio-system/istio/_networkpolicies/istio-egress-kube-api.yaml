---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: istio-egress-kube-api
  namespace: istio-system
spec:
  description: >-
    Allows the istio components to reach the API server to watch cluster state.
  endpointSelector:
    matchExpressions:
      - key: k8s:app.kubernetes.io/name
        operator: In
        values:
          - istio-cni
          - istiod
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
