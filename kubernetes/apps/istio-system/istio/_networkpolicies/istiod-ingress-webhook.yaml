---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: istiod-ingress-webhook
  namespace: istio-system
spec:
  description: >-
    Allows the API server to reach the istiod injection/validation webhook.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: istiod
  ingress:
    # The API server drives the injection/validation webhook. Cross-node calls
    # egress via the remote node's CiliumInternalIP, which carries the
    # `remote-node` identity (only the node's primary IP gets the `kube-apiserver`
    # label), so remote-node is required too.
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "15017" # injection/validation webhook
              protocol: TCP
            - port: "443"
              protocol: TCP
