---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/part-of: grafana
spec:
  version: mirror.gcr.io/grafana/grafana:13.3.1
  serviceAccount:
    automountServiceAccountToken: false
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "false"
    auth.anonymous:
      enabled: "true"
    log:
      mode: console
    log.console:
      format: json
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
      preinstall_auto_update: "false"
    security:
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            ingress.policy.home.arpa/internal-gateway: "true"
            app.kubernetes.io/name: grafana
            app.kubernetes.io/instance: grafana
        spec:
          containers:
            - name: grafana
              resources:
                requests:
                  cpu: 50m
                  memory: 512Mi
                limits:
                  memory: 768Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                # Install the VictoriaLogs datasource plugin at startup. The plugins dir lives on the
                # grafana-pvc, so this works despite readOnlyRootFilesystem.
                - name: GF_INSTALL_PLUGINS
                  value: victoriametrics-logs-datasource
              volumeMounts:
                - name: serviceaccount-token
                  mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc

            - name: serviceaccount-token
              projected:
                defaultMode: 0444
                sources:
                  - serviceAccountToken:
                      expirationSeconds: 3607
                      path: token
                  - configMap:
                      name: kube-root-ca.crt
                      items:
                        - key: ca.crt
                          path: ca.crt
                  - downwardAPI:
                      items:
                        - path: namespace
                          fieldRef:
                            apiVersion: v1
                            fieldPath: metadata.namespace
  httpRoute:
    spec:
      hostnames:
        - grafana.internal.${DOMAIN}
      parentRefs:
        - kind: ListenerSet
          name: internal
          namespace: gateways
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: ceph-block
  disableDefaultSecurityContext: All
