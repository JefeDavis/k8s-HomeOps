---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
spec:
  chartRef:
    kind: OCIRepository
    name: grafana-operator
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    dashboard:
      enabled: true
    serviceMonitor:
      enabled: true
    logging:
      encoder: json
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
