---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-egress-tempo
  namespace: observability
spec:
  description: >-
    Allows Grafana to reach the Tempo datasource query API (:3200).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: grafana
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: tempo
      toPorts:
        - ports:
            - port: "3200"
              protocol: TCP
