---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-egress-grafana-com
  namespace: observability
spec:
  description: >-
    Allows grafana to download plugins from grafana.com (:443). Dashboards are fetched by
    grafana-operator, not the grafana instance.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: grafana
  egress:
    - toFQDNs:
        - matchName: grafana.com
        - matchPattern: "*.grafana.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
