---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-operator-ingress-metrics
  namespace: observability
spec:
  description: >-
    Allows the observability stack to scrape the grafana operator
    metrics on 9090.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: grafana-operator
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alloy
            k8s:app.kubernetes.io/name: alloy
            k8s:app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
