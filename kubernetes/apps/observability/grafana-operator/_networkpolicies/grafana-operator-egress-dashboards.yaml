---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-operator-egress-dashboards
  namespace: observability
spec:
  description: >-
    Allows grafana-operator to fetch dashboard JSON from grafana.com (grafanaCom dashboards) and
    raw.githubusercontent.com (url dashboards) on 443, which it then pushes to grafana.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: grafana-operator
  egress:
    - toFQDNs:
        - matchName: grafana.com
        - matchPattern: "*.grafana.com"
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
