---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-operator-egress-kube-api
  namespace: observability
spec:
  description: >-
    Allows grafana-operator to reach the API server.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: grafana-operator
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
