---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
  namespace: observability
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
    namespace: observability
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    server:
      fullnameOverride: victoria-logs
      mode: statefulSet
      retentionPeriod: "30d"
      priorityClassName: platform-low
      podLabels:
        ingress.policy.home.arpa/internal-gateway: "true"
      persistentVolume:
        enabled: true
        size: 20Gi
        storageClassName: ceph-block
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: GOMEMLIMIT
          value: "460MiB"
      # Memory-only limit: bound the hard cap, leave CPU burstable.
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 96Mi
      # Expose /metrics to the Prometheus-Operator scrape path (alloy-metrics scrapes ServiceMonitors).
      serviceMonitor:
        enabled: true
    serviceAccount:
      create: true
      automountToken: false
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
        spec:
          instanceSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: grafana
  # The chart hardcodes `dashboards: grafana` into the GrafanaDashboard instanceSelector; strip it
  # so the selector matches this cluster's Grafana instance (which carries no such label).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: GrafanaDashboard
            patch: |
              - op: remove
                path: /spec/instanceSelector/matchLabels/dashboards
