---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager-ingress-alerts
  namespace: observability
spec:
  description: >-
    Allows prometheus to send firing alerts to alertmanager (:9093).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: alertmanager
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
