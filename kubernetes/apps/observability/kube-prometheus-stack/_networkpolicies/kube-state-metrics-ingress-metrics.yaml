---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-state-metrics-ingress-metrics
  namespace: observability
spec:
  description: >-
    Allows the Alloy metrics collector to scrape the kube-state-metrics metrics port (8080).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: kube-state-metrics
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alloy
            k8s:app.kubernetes.io/name: alloy
            k8s:app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
