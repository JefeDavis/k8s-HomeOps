---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mosquitto-metrics
  namespace: home
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - spiffe://cluster.local/ns/alloy/sa/alloy-metrics
      to:
        - operation:
            ports:
              - "9234"
