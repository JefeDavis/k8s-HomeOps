---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mosquitto
spec:
  interval: 10m
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: mosquitto

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      *app :
        type: statefulset
        containers:
          *app :
            image:
              repository: mirror.gcr.io/eclipse-mosquitto
              tag: 2.0.23
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 16Mi
              limits:
                memory: 128Mi
          exporter:
            image:
              repository: ghcr.io/d0ugal/mosquitto-exporter
              tag: v0.2.65
            env:
              MOSQUITTO_BROKER_ENDPOINT: tcp://127.0.0.1:1883
              SERVER_PORT: &metrics 9234
              TRACING_ENABLED: "true"
              TRACING_SERVICE_NAME: mosquitto-exporter
              TRACING_ENDPOINT: http://alloy-traces.alloy.svc.cluster.local:4318/v1/traces
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: "10m"
                memory: "32Mi"
              limits:
                memory: "64Mi"

        statefulset:
          volumeClaimTemplates:
            - name: config
              storageClass: ceph-block
              accessMode: ReadWriteOnce
              size: 5Gi

    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      *app :
        controller: *app
        ports:
          mqtt:
            port: 1883
          metrics:
            port: *metrics

    serviceMonitor:
      app:
        serviceName: mosquitto
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s

    configMaps:
      config:
        data:
          mosquitto.conf: |-
            allow_anonymous true
            autosave_interval 60
            connection_messages false
            listener 1883

            per_listener_settings false
            persistence true
            persistence_location /config

    persistence:
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
