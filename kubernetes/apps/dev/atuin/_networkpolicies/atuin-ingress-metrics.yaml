---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atuin-ingress-metrics
  namespace: dev
spec:
  description: >-
    Allows the alloy-metrics collector to scrape atuin metrics on 8080.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: atuin
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alloy
            k8s:app.kubernetes.io/name: alloy
            k8s:app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
