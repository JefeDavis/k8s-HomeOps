---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-atuin
spec:
  instances: 3
  inheritedMetadata:
    annotations:
      logs.observability.home.arpa/format: cnpg
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-standard-trixie
    major: 18
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  bootstrap:
    recovery:
      source: external
      database: atuin
      owner: atuin

  externalClusters:
    - name: external
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: pg-${APP}
          serverName: pg-atuin

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-${APP}
        serverName: pg-atuin-blue
