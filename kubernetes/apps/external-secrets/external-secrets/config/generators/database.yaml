---
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: database-password-generator
spec:
  kind: Password
  generator:
    passwordSpec:
      length: 32
      digits: 5
      # Alphanumeric only: DB passwords flow through connection URIs (pgloader, DSNs),
      # and chars like '^' require fragile percent-encoding. 32 chars keeps entropy high.
      symbols: 0
      # symbols: 5
      # symbolCharacters: "-_&*^!"
      noUpper: false
      allowRepeat: true
