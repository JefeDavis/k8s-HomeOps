---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-webhook-ingress-kube-api
  namespace: external-secrets
spec:
  description: >-
    Allows the API server to reach the external-secrets validating/conversion webhook on 10250.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: external-secrets-webhook
  ingress:
    # Cross-node API server webhook calls egress via the remote node's
    # CiliumInternalIP, which carries the `remote-node` identity (only the node's
    # primary IP gets the `kube-apiserver` label), so remote-node is required too.
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
