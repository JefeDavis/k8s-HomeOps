---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volsync-template-reader
  namespace: volsync-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: volsync-template-reader
  namespace: volsync-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["volsync-secret"]
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: volsync-template-reader
  namespace: volsync-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: volsync-template-reader
subjects:
  - kind: ServiceAccount
    name: volsync-template-reader
    namespace: volsync-system
