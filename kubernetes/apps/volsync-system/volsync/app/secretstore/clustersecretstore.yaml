---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: volsync-template
spec:
  provider:
    kubernetes:
      remoteNamespace: volsync-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: volsync-system
          key: ca.crt
      auth:
        serviceAccount:
          name: volsync-template-reader
          namespace: volsync-system
