---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync-system
spec:
  chartRef:
    kind: OCIRepository
    name: volsync
    namespace: volsync-system
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    manageCRDs: true
    replicaCount: 2
    podAnnotations:
      logs.observability.home.arpa/format: zap
    metrics:
      disableAuth: true
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 192Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: volsync
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: volsync
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          limits:
                            cpu: null
