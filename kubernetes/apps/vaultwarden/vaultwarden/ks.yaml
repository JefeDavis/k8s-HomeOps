---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vaultwarden-database
  namespace: vaultwarden
spec:
  targetNamespace: vaultwarden
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: &app vaultwarden
  interval: 1h
  path: "./kubernetes/apps/vaultwarden/vaultwarden/database"
  components:
    - ../../../../components/cnpg
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-homeops
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
  wait: true
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vaultwarden
  namespace: vaultwarden
spec:
  targetNamespace: vaultwarden
  interval: 1h
  path: "./kubernetes/apps/vaultwarden/vaultwarden/app"
  components:
    - ../../../../components/kopiur
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-homeops
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: vaultwarden-data
      KOPIUR_CAPACITY: 15Gi
  wait: true
  dependsOn:
    - name: vaultwarden-database
      namespace: vaultwarden
    - name: kopiur-repository
      namespace: kopiur-system
