---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-internet
  namespace: vaultwarden
spec:
  description: >-
    Allows vaultwarden to download metadata from the internet
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: vaultwarden
