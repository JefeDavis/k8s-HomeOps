---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vaultwarden
  namespace: vaultwarden
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: vaultwarden
    namespace: vaultwarden
  values:
    controllers:
      *app :
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            logs.observability.home.arpa/format: plain
          labels:
            ingress.policy.home.arpa/external-gateway: "true"
        containers:
          *app :
            image:
              repository: ghcr.io/dani-garcia/vaultwarden
              tag: 1.37.5
            env:
              DATA_FOLDER: "data"
              ICON_CACHE_FOLDER: "icons"
              ATTACHMENTS_FOLDER: "data/attachments"
              SENDS_FOLDER: "data/sends"
              TMP_FOLDER: "/tmp"
              DOMAIN: "https://vault.${DOMAIN}"
              SMTP_FROM_NAME: Vault
              SMTP_FROM: vault@${DOMAIN}
              SMTP_HOST: smtp-relay.network.svc.cluster.local
              SMTP_PORT: 2525
              SMTP_SECURITY: "off"
              ROCKET_PORT: &port 80
              SIGNUPS_ALLOWED: "false"
              INVITATIONS_ALLOWED: true
              SENDS_ALLOWED: true
              EMERGENCY_ACCESS_ALLOWED: true
              DISABLE_ICON_DOWNLOAD: false
              DISABLE_2FA_REMEMBER: false
              PASSWORD_HINTS_ALLOWED: false
              PUSH_ENABLED: "true"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: pg-vaultwarden-app
                    key: uri
            envFrom:
              - secretRef:
                  name: vaultwarden-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                memory: 32Mi
                cpu: 10m
              limits:
                memory: 96Mi

    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: *app

    serviceAccount:
      *app :
        automountServiceAccountToken: false

    service:
      *app :
        controller: *app
        ports:
          http:
            port: *port

    route:
      *app :
        enabled: true
        kind: HTTPRoute
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/icon: "ph:password-fill"
        parentRefs:
          - kind: ListenerSet
            name: external
            namespace: gateways
        hostnames:
          - vault.${DOMAIN}
        rules:
          - backendRefs:
              - kind: Service
                identifier: *app
                port: http
            matches:
              - path:
                  type: PathPrefix
                  value: /

    persistence:
      data:
        existingClaim: ${KOPIUR_CLAIM}

      icons:
        type: emptyDir

      tmp:
        type: emptyDir
