---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: reflector-egress-kube-api
  namespace: system
spec:
  description: >-
    Allows reflector to reach the API server to manage secrets and configmaps.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: reflector
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
