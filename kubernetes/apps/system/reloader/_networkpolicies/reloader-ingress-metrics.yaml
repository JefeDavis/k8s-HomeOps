---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: reloader-ingress-metrics
  namespace: system
spec:
  description: >-
    Allows the observability stack to scrape the reloader
    metrics/health endpoint on 9090.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: reloader
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alloy
            k8s:app.kubernetes.io/name: alloy
            k8s:app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
