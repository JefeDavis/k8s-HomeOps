---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-node-critical
value: 100001000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: >-
  Node-pinned platform DaemonSets that must claim a slot on every node (node-exporter, alloy-logs).
  Preempts lower priorities because a node-pinned pod cannot reschedule to a new node.
