---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ingress-internal-gateway
spec:
  description: >-
    Allows workloads opted in with the ingress.gateway.homeops.io/internal=true label to
    receive traffic from the internal gateway's Envoy proxies in the gateways namespace.
  endpointSelector:
    matchLabels:
      k8s:ingress.gateway.homeops.io/internal: "true"
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gateways
            k8s:app.kubernetes.io/managed-by: envoy-gateway
            k8s:gateway.networking.k8s.io/gateway-name: internal-gateway
