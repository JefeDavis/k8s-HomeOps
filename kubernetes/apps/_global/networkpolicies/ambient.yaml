---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ambient
spec:
  description: >-
    Allows pods in Istio ambient namespaces to carry ztunnel HBONE traffic on port 15008 (the
    mutual-TLS tunnel between ztunnel and mesh workloads), and permits the node-local ztunnel
    health-check source (169.254.7.127).
  egress:
    - toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.namespace.labels.istio.io/dataplane-mode: ambient
  ingress:
    - toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
    - fromCIDR:
        - 169.254.7.127/32
