---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-ambient
spec:
  egress:
    - toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.namespace.labels.istio.io/dataplane-mode: ambient
  ingress:
    - toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
    - fromCIDR:
        - 169.254.7.127/32
