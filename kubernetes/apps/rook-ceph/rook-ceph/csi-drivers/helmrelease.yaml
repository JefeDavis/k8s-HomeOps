---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
  namespace: rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    # Rook-compatible values, see
    # https://github.com/rook/rook/blob/master/deploy/charts/ceph-csi-drivers/values.yaml
    operatorConfig:
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        log:
          rotation:
            enabled: false
        nodePlugin:
          priorityClassName: system-node-critical
          annotations:
            logs.observability.home.arpa/format: klog
          resources:
            plugin:
              limits:
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 64Mi
            registrar:
              limits:
                memory: 96Mi
              requests:
                cpu: 10m
                memory: 32Mi
        controllerPlugin:
          priorityClassName: system-cluster-critical
          resources:
            attacher:
              limits:
                memory: 96Mi
              requests:
                cpu: 10m
                memory: 32Mi
            omapGenerator:
              limits:
                memory: 96Mi
              requests:
                cpu: 10m
                memory: 32Mi
            plugin:
              limits:
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 64Mi
            provisioner:
              limits:
                memory: 96Mi
              requests:
                cpu: 10m
                memory: 32Mi
            resizer:
              limits:
                memory: 96Mi
              requests:
                cpu: 10m
                memory: 32Mi
            snapshotter:
              limits:
                memory: 96Mi
              requests:
                cpu: 10m
                memory: 32Mi
    drivers:
      rbd:
        name: rook-ceph.rbd.csi.ceph.com
        # Chart defaults render grpcTimeout 30, replicas 1, snapshotPolicy none and
        # log rotation on
        grpcTimeout: 150
        snapshotPolicy: volumeGroupSnapshot
        log:
          rotation:
            enabled: false
        controllerPlugin:
          # With this gate on, the provisioner never becomes ready without the
          # ReferenceGrant CRD (from envoy-gateway) and the RBAC in rbac.yaml
          containerExtraArgs:
            csi-provisioner:
              - --feature-gates=CrossNamespaceVolumeDataSource=true
          replicas: 2
      cephfs:
        name: rook-ceph.cephfs.csi.ceph.com
        grpcTimeout: 150
        snapshotPolicy: volumeGroupSnapshot
        log:
          rotation:
            enabled: false
        controllerPlugin:
          replicas: 2
      nfs:
        enabled: false
        name: rook-ceph.nfs.csi.ceph.com
      nvmeof:
        enabled: false
        name: rook-ceph.nvmeof.csi.ceph.com
