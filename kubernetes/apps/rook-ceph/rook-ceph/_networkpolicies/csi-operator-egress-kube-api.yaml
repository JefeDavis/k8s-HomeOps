---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: csi-operator-egress-kube-api
  namespace: rook-ceph
spec:
  description: Allows the ceph-csi-operator to reach the API server.
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: ceph-csi
