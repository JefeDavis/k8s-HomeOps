---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rgw-ingress
  namespace: rook-ceph
spec:
  description: >-
    Allows any pod labeled egress.policy.home.arpa/rgw=true to reach the rgw S3 endpoint
    (container port 8080 behind the Service's port 80).
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:egress.policy.home.arpa/rgw: "true"
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: ceph-rgw
      k8s:app.kubernetes.io/part-of: ceph-objectstore
