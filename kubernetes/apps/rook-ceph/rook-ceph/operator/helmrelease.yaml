---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  values:
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    obcAllowAdditionalConfigFields: maxObjects,maxSize,bucketLifecycle,bucketMaxSize
    resources:
      requests:
        cpu: 100m # unchangable
        memory: 128Mi # unchangable
