---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: resume-operator
  namespace: resume
spec:
  targetNamespace: resume
  interval: 1h
  path: "./kubernetes/apps/resume/resume/operator"
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-homeops
    namespace: flux-system
  wait: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: resume-cv
  namespace: resume
spec:
  targetNamespace: resume
  interval: 1h
  path: "./kubernetes/apps/resume/resume/cv"
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-homeops
    namespace: flux-system
  wait: true
  dependsOn:
    - name: resume-operator
      namespace: resume
    - name: gateways
      namespace: gateways
