---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/name: &app webhook-receiver
    app.kubernetes.io/instance: *app
    app.kubernetes.io/part-of: flux
  name: *app
  namespace: flux-system
spec:
  hostnames:
    - flux-webhook.${DOMAIN}
  parentRefs:
    - kind: ListenerSet
      name: ${DOMAIN}
      namespace: gateway-system
  rules:
    - backendRefs:
        - kind: Service
          name: *app
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /hook/
