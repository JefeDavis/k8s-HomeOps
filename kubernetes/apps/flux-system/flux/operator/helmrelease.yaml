---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
    namespace: flux-system
  interval: 1h
  values:
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 1Gi
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
    extraVolumes:
      - name: serviceaccount-token
        projected:
          defaultMode: 444
          sources:
            - serviceAccountToken:
                expirationSeconds: 3607
                path: token
            - configMap:
                name: kube-root-ca.crt
                items:
                  - key: ca.crt
                    path: ca.crt
            - downwardAPI:
                items:
                  - path: namespace
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.namespace
    extraVolumeMounts:
      - name: serviceaccount-token
        mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        readOnly: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
          # Strip the chart's CPU limit on the operator (memory-only, ADR 0010); Flux SSA ignores a
          # values-level null, so remove it post-render.
          - target:
              kind: Deployment
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          limits:
                            cpu: null
