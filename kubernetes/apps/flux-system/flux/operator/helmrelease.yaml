---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
    namespace: flux-system
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    resources:
      requests:
        cpu: 15m
        memory: 384Mi
      limits:
        memory: 512Mi
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
    web:
      config:
        authentication:
          type: Anonymous
          anonymous:
            username: flux
            groups:
              - flux-admin
      httpRoute:
        enabled: true
        hostnames:
          - flux.internal.${DOMAIN}
        parentRefs:
          - kind: ListenerSet
            name: internal
            namespace: gateways
      networkPolicy:
        create: false
    extraVolumes:
      - name: serviceaccount-token
        projected:
          defaultMode: 444
          sources:
            - serviceAccountToken:
                expirationSeconds: 3607
                path: token
            - configMap:
                name: kube-root-ca.crt
                items:
                  - key: ca.crt
                    path: ca.crt
            - downwardAPI:
                items:
                  - path: namespace
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.namespace
    extraVolumeMounts:
      - name: serviceaccount-token
        mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        readOnly: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
