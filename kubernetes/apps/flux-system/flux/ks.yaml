---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/flux-system/flux/operator
  prune: false # Never delete this
  sourceRef:
    kind: GitRepository
    name: k8s-homeops
    namespace: flux-system
  wait: true
  decryption:
    provider: sops
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-instance
  namespace: flux-system
  labels:
    app.kubernetes.io/name: flux-instance
spec:
  interval: 1h
  path: ./kubernetes/apps/flux-system/flux/instance
  prune: false # Never delete this
  sourceRef:
    kind: GitRepository
    name: k8s-homeops
  wait: false
  decryption:
    provider: sops
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  dependsOn:
    - name: flux-operator
      namespace: flux-system
    - name: kube-prometheus-stack-crds
      namespace: observability
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/flux-system/flux/webhook
  prune: false # Never delete this
  sourceRef:
    kind: GitRepository
    name: k8s-homeops
  wait: false
  decryption:
    provider: sops
  dependsOn:
    - name: flux-instance
      namespace: flux-system
    - name: envoy-gateway
      namespace: envoy-gateway
