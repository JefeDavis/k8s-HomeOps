---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-notification-controller-ingress-events
  namespace: flux-system
spec:
  description: >-
    Allows the flux controllers to send events to the notification-controller's event
    receiver (:9090).
  endpointSelector:
    matchLabels:
      k8s:app: notification-controller
      k8s:app.kubernetes.io/part-of: flux
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/part-of: flux
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
