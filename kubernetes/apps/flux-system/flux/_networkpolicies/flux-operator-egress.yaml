---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-operator-egress-artifacts
  namespace: flux-system
spec:
  description: >-
    Allows the flux-operator to reach the API server to reconcile the FluxInstance.
    Additionally, allows the flux-operator to pull distribution artifacts from ghcr
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    - toFQDNs:
        - matchName: pkg-containers.githubusercontent.com
        - matchName: ghcr.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: flux-operator
