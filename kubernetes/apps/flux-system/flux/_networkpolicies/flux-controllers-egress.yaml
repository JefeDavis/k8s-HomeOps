---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-controllers-egress
  namespace: flux-system
spec:
  description:
    Allows the flux controllers to reach the API server to reconcile cluster
    state.
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/part-of: flux
