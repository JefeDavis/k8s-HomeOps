---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pg-${APP}-ingress
spec:
  description: >-
    Allows the cnpg operator to reach this cluster's instance-manager API (:8000).
  endpointSelector:
    matchLabels:
      k8s:cnpg.io/cluster: pg-${APP}
      k8s:cnpg.io/podRole: instance
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: cloudnative-pg
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alloy
            k8s:app.kubernetes.io/name: alloy
            k8s:app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
