min_version = "2026.11.3"
monorepo_root = true

[tools]
"aqua:siderolabs/talos" = "1.14.6"
"github:mitsuhiko/minijinja" = "latest"
"aqua:getsops/sops" = "3.13.3"
"aqua:mikefarah/yq" = "4.54.3"
"aqua:jqlang/jq" = "1.8.2"
"aqua:charmbracelet/gum" = "2.0.2"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.2"
"aqua:helm/helm" = "4.3.2"
"aqua:helmfile/helmfile" = "1.8.5"
"github:home-operations/flate" = "0.8.0"
"github:elsesiy/kubectl-view-secret" = "0.17.0"
# Git hook runner and the formatters/linters its pre-commit jobs invoke
# (see .lefthook.toml). `mise install` runs `lefthook install` via the
# postinstall hook below.
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:oxc-project/oxc/oxfmt" = "0.79.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:zizmorcore/zizmor" = "1.32.0"

[env]
FLATE_PATH = '{{config_root}}/kubernetes/apps'
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
KUBECONFIG = "{{config_root}}/kubeconfig"

[hooks]
postinstall = "lefthook install"

# Shell completion runs this outside the task environment, from the caller's directory.
[task_templates.node]
usage = '''
complete "node" run="find \"$(git rev-parse --show-toplevel)/talos/nodes\" -name '*.yaml.j2' ! -name '*.schematic.yaml.j2' -exec basename {} .yaml.j2 \\; | sort"
'''

[tasks.log]
hide = true
run = "gum log -t rfc3339 -s -l"

# Renders a minijinja template with the SOPS-decrypted Talos secret bundle as the
# template context (replaces onedr0p's `op inject`). Runs in the caller's
# directory, so callers pass template paths relative to it.
[tasks.template]
hide = true
dir = "{{ cwd }}"
usage = '''
arg "<file>" help="Template path, or - for stdin"
arg "[args]" var=#true help="Extra arguments for minijinja-cli"
'''
run = '''
eval "args=(${usage_args:-})"
secrets="$(git rev-parse --show-toplevel)/talos/talos.sops.yaml"
minijinja-cli --format=yaml "$usage_file" <(sops --decrypt "$secrets") "${args[@]}"
'''

[task_config]
cascade = true
shell = "bash -euo pipefail -c"

[monorepo]
config_roots = ["bootstrap", "kubernetes", "talos"]

[settings]
task.quiet = true
